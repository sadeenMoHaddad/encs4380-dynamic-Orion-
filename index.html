<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module 1: First-order time response</title>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 12px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px;
      background: #f1f4f8;
      border-radius: 8px;
    }

    nav a {
      color: #174ea6;
      font-weight: bold;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    input[type="range"] {
      width: 100%;
    }

    .panel {
      background: #eee;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid #888;
      padding: 6px 10px;
      text-align: left;
    }
  </style>
</head>

<body>

<nav aria-label="Module navigation">
  <a href="#module1">Module 1</a>
  <a href="module_2.html">Module 2</a>
  <a href="module_3.html">Module 3</a>
  <a href="module_4.html">Module 4</a>
</nav>

<h2 id="module1">Module 1: First-order time response</h2>

  <label for="mode">Input:</label>
  <select id="mode">
    <option value="step">Step</option>
    <option value="ramp">Ramp</option>
  </select>

  <div>
    <label for="K">K = <span id="Kv">1</span></label>
    <input type="range" id="K" min="0.5" max="5" step="0.1" value="1">
  </div>

  <div>
    <label for="tau">τ = <span id="tv">10</span> s</label>
    <input type="range" id="tau" min="1" max="30" step="0.5" value="10">
  </div>

  <section class="panel">
    <strong>Predict, then check:</strong>
    <p id="guessPrompt">For a step input, guess y(τ):</p>
    <label for="guess">Your guess:</label>
    <input type="number" id="guess" step="0.1">
    <button type="button" id="checkButton">Check</button>
    <span id="guessResult" aria-live="polite"></span>
  </section>

  <div id="plot"></div>
  <div id="errplot"></div>
  <div id="rampNote" class="panel" hidden></div>
  <div id="checks"></div>

  <script>
    const A = 1;
    const $ = id => document.getElementById(id);

    function response(t, K, tau, mode) {
      if (mode === "step") {
        return K * A * (1 - Math.exp(-t / tau));
      }

      return K * A * (t - tau * (1 - Math.exp(-t / tau)));
    }

    function checkGuess() {
      const guessText = $("guess").value;
      const guess = Number(guessText);
      const K = Number($("K").value);
      const expected = 0.6321205588 * K * A;

      if (guessText === "" || !Number.isFinite(guess)) {
        $("guessResult").textContent = "Enter your guess first.";
        return;
      }

      const tolerance = Math.max(0.05, expected * 0.02);

      $("guessResult").textContent =
        Math.abs(guess - expected) <= tolerance
          ? `✅ Correct! y(τ) ≈ ${expected.toFixed(3)}`
          : `❌ Try again. y(τ) ≈ ${expected.toFixed(3)}`;
    }

    function update() {
      const K = Number($("K").value);
      const tau = Number($("tau").value);
      const mode = $("mode").value;

      $("Kv").textContent = K.toFixed(1);
      $("tv").textContent = tau.toFixed(1);

      $("guessPrompt").textContent = mode === "step"
        ? "For a step input, guess y(τ):"
        : "Switch to Step input to use this prediction check.";

      $("guess").disabled = mode !== "step";
      $("checkButton").disabled = mode !== "step";

      if (mode !== "step") {
        $("guessResult").textContent = "";
      }

      const T = Array.from(
        { length: 301 },
        (_, i) => i * 5 * tau / 300
      );

      const ideal = T.map(t =>
        mode === "step" ? K * A : K * A * t
      );

      const dt = T[1] - T[0];
      const yEuler = [];
      let currentY = 0;

      for (let i = 0; i < T.length; i++) {
        yEuler.push(currentY);

        const input = mode === "step" ? A : A * T[i];
        const derivative = (K * input - currentY) / tau;

        currentY += derivative * dt;
      }

      const plotData = [
        {
          x: T,
          y: T.map(t => response(t, K, tau, mode)),
          name: "Exact response y(t)",
          mode: "lines",
          line: { width: 4 }
        },
        {
          x: T,
          y: yEuler,
          name: "Euler solver (bonus)",
          mode: "lines",
          line: { dash: "dash", color: "red" }
        },
        {
          x: T,
          y: ideal,
          name: "Ideal input × K",
          mode: "lines",
          line: { dash: "dot", color: "gray" }
        }
      ];

      const layout = {
        title: "First-order response",
        xaxis: { title: "Time t (s)" },
        yaxis: { title: "Output y(t)" },
        margin: { t: 45 },
        shapes: []
      };

      if (mode === "step") {
        $("errplot").style.display = "block";
        $("rampNote").hidden = true;

        const t1 = tau;
        const t2 = 3 * tau;
        const y1 = response(t1, K, tau, mode);
        const y2 = response(t2, K, tau, mode);

        layout.shapes.push(
          {
            type: "line",
            x0: t1, x1: t1,
            y0: 0, y1: 1,
            yref: "paper",
            line: { color: "green", dash: "dash" }
          },
          {
            type: "line",
            x0: t2, x1: t2,
            y0: 0, y1: 1,
            yref: "paper",
            line: { color: "blue", dash: "dash" }
          }
        );

        plotData.push({
          x: [t1, t2],
          y: [y1, y2],
          name: "Required response points",
          mode: "markers+text",
          text: ["63.2% at τ", "95% at 3τ"],
          textposition: "top right",
          marker: { size: 10, color: ["green", "blue"] }
        });

        $("checks").innerHTML = `
          <h3>Validation</h3>
          <table>
            <tr>
              <th>Test</th>
              <th>Expected</th>
              <th>Calculated</th>
              <th>Result</th>
            </tr>
            <tr>
              <td>y(τ) = 0.632KA</td>
              <td>${(0.632 * K * A).toFixed(3)}</td>
              <td>${y1.toFixed(3)}</td>
              <td>${Math.abs(y1 - 0.632 * K * A) < 0.01 * K ? "PASS" : "FAIL"}</td>
            </tr>
            <tr>
              <td>y(3τ) = 0.95KA</td>
              <td>${(0.95 * K * A).toFixed(3)}</td>
              <td>${y2.toFixed(3)}</td>
              <td>${Math.abs(y2 - 0.95 * K * A) < 0.01 * K ? "PASS" : "FAIL"}</td>
            </tr>
          </table>`;

        const errorTimes = T.slice(1);
        const errorFraction = errorTimes.map(t => Math.exp(-t / tau));
        const slope10 = -1 / (tau * Math.LN10);

        Plotly.react("errplot", [{
          x: errorTimes,
          y: errorFraction,
          name: "Error fraction E(t)",
          mode: "lines"
        }], {
          title: `Error fraction (log10 axis); slope = ${slope10.toFixed(4)} s⁻¹`,
          xaxis: { title: "Time t (s)" },
          yaxis: { title: "Error fraction", type: "log" },
          margin: { t: 45 }
        }, { responsive: true });

      } else {
        $("checks").innerHTML = "";
        $("errplot").style.display = "none";
        $("rampNote").hidden = false;
        $("rampNote").innerHTML = `
          <strong>Ramp response:</strong>
          ramp lag = τ = ${tau.toFixed(1)} s;
          steady-state error approaches
          KAτ = ${(K * A * tau).toFixed(2)}.`;
      }

      Plotly.react("plot", plotData, layout, { responsive: true });
    }

    ["K", "tau", "mode"].forEach(id =>
      $(id).addEventListener("input", update)
    );

    $("checkButton").addEventListener("click", checkGuess);

    update();
  </script>
</body>
</html>
